name: MysteryBoard Pages – manuell vorbereiten oder freigeben

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Quellcommit oder Branch; leer = Commit des ausgewählten Workflow-Refs"
        required: false
        default: ""
        type: string
      publish:
        description: "Öffentliche Pages-Veröffentlichung nach gesonderter Freigabe aktivieren"
        required: true
        default: false
        type: boolean
      confirmation:
        description: "Nur zur Veröffentlichung exakt eingeben: BODEN-MYSTERY VERÖFFENTLICHEN"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: mysteryboard-pages
  cancel-in-progress: false

jobs:
  verify-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Ausdrückliche Veröffentlichungsbestätigung prüfen
        if: ${{ inputs.publish }}
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != "BODEN-MYSTERY VERÖFFENTLICHEN" ]; then
            echo "Die gesonderte Veröffentlichungsbestätigung fehlt. Abbruch."
            exit 1
          fi
      - name: Gewählten Quellstand auschecken
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Tatsächlichen Quellcommit festhalten
        id: source
        run: |
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'Quellcommit: `%s`\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Abhängigkeiten gemäß Lockdatei installieren
        run: npm ci
      - name: Prüf-Chromium installieren
        run: npx playwright install --with-deps chromium
      - name: Chromium-Pfad für bestehende Testkonfiguration setzen
        run: |
          node --input-type=module -e "import { chromium } from '@playwright/test'; console.log('CHROMIUM_PATH=' + chromium.executablePath());" >> "$GITHUB_ENV"
      - name: Alle Daten-, Build- und Chromium-Regressionstests ausführen
        shell: bash
        run: |
          mkdir -p dist
          {
            node --version
            npm --version
            npx playwright --version
            "$CHROMIUM_PATH" --version
            npm run check
          } 2>&1 | tee dist/pages-check.log
      - name: Byteidentisches Pages-Paket erzeugen
        run: |
          node scripts/prepare-pages.mjs
          cat dist/pages/README.md >> "$GITHUB_STEP_SUMMARY"
          printf '\nVeröffentlichung angefordert: %s\n' "$PUBLISH_REQUESTED" >> "$GITHUB_STEP_SUMMARY"
        env:
          PUBLISH_REQUESTED: ${{ inputs.publish }}
      - name: Geprüfte Produktionsdateien und Prüfprotokoll bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: mysteryboard-candidate-${{ steps.source.outputs.sha }}
          path: |
            artifacts/*.html
            dist/pages/manifest.json
            dist/pages/README.md
            dist/pages-check.log
            playwright-report/
          if-no-files-found: error
          retention-days: 30
      - name: Pages-Paket als Artefakt bereitstellen (noch keine Veröffentlichung)
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

  deploy:
    if: ${{ inputs.publish && inputs.confirmation == 'BODEN-MYSTERY VERÖFFENTLICHEN' }}
    needs: verify-and-package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Ausdrücklich freigegebenes Pages-Paket veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
