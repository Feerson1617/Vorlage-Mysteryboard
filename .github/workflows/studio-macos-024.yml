name: MysteryBoard Studio 0.2.4 – macOS ARM64 Release Candidate
on:
  push:
    branches: [fix/mysteryboard-studio-024-import-reliability]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: macos-26
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build the Apple Silicon DMG
        run: |
          set -euo pipefail
          mkdir -p artifacts/mac-board-tests artifacts/studio-tests
          node -e "if(process.platform!=='darwin'||process.arch!=='arm64')process.exit(1)"
          npm run studio:make -- --platform=darwin --arch=arm64 2>&1 | tee artifacts/mac-board-tests/Build.log
      - name: Verify and install the actual DMG
        shell: bash
        run: |
          set -euo pipefail
          studio_dmg_path="$(python3 -c 'import pathlib; print(next(pathlib.Path("out/make").rglob("*.dmg")))' )"
          hdiutil verify "$studio_dmg_path" 2>&1 | tee artifacts/mac-board-tests/DMG.log
          studio_mount="$RUNNER_TEMP/studio-board-volume"
          studio_install="$RUNNER_TEMP/studio-board-installed/MysteryBoard Studio.app"
          mkdir -p "$studio_mount" "$(dirname "$studio_install")"
          hdiutil attach -readonly -nobrowse -mountpoint "$studio_mount" "$studio_dmg_path"
          ditto "$studio_mount/MysteryBoard Studio.app" "$studio_install"
          hdiutil detach "$studio_mount"
          codesign --verify --deep --strict "$studio_install"
          codesign -dv --verbose=4 "$studio_install" > artifacts/mac-board-tests/Signatur.log 2>&1
          echo "STUDIO_EXEC=$studio_install/Contents/MacOS/MysteryBoard Studio" >> "$GITHUB_ENV"
          cp "$studio_dmg_path" artifacts/mac-board-tests/MysteryBoard-Studio-0.2.4-Mac-Apple-Silicon.dmg
      - name: Select an available native display mode and install independent test tools
        run: |
          swift qa/studio/import-024/display.swift > artifacts/mac-board-tests/Quartz.log
          python3 -m venv "$RUNNER_TEMP/matrix-python"
          "$RUNNER_TEMP/matrix-python/bin/pip" install PyMuPDF==1.26.7 Pillow==12.0.0 reportlab python-docx
          echo "$RUNNER_TEMP/matrix-python/bin" >> "$GITHUB_PATH"
      - name: Board gestures and author connections in the installed application
        shell: bash
        run: |
          set -euo pipefail
          STUDIO_VERSION=0.2.4 node qa/studio/mac-board-native.mjs 2>&1 | tee artifacts/mac-board-tests/Pinnwand.log
      - name: Actual SCORM and PNG round trip
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install chromium webkit
          node qa/studio/mac-board-player.mjs 2>&1 | tee artifacts/mac-board-tests/Schuelerplayer.log
      - name: Reproduce on 0.2.1 and stress both browsers against the installed export
        shell: bash
        run: |
          set -euo pipefail
          evidence=artifacts/mac-board-tests
          node qa/studio/student-release.mjs qa/studio/evidence/player-021/Starthilfe-SCORM.zip "$evidence/before" --expect-regression
          node qa/studio/student-release.mjs "$evidence/Starthilfe-SCORM.zip" "$evidence/after"
          node qa/studio/student-stability.mjs "$evidence/player-chromium" "$evidence/Starthilfe-SCORM.zip" 2>&1 | tee "$evidence/Studenten-Chromium.log"
          MB_ENGINE=webkit node qa/studio/student-stability.mjs "$evidence/player-webkit" "$evidence/Starthilfe-SCORM.zip" 2>&1 | tee "$evidence/Studenten-WebKit.log"
      - name: Same projects in the installed Studio 0.2.2 reference
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          before="$RUNNER_TEMP/studio-022-reference"
          mkdir -p "$before/mount" "$before/install"
          gh run download 44298801016 --repo "$GITHUB_REPOSITORY" --name 'Studio-0.2.2-native-e5cfa0dce1e96524955921ea130a6777a7c8136f' --dir "$before/download"
          dmg="$(find "$before/download" -name '*.dmg' -print -quit)"
          test -n "$dmg"
          printf '%s  %s\n' '734a2b40b1f32dd401e6b31ae461c862471a932cf30fc0d15f5ce73baa3942e6' "$dmg" | shasum -a 256 -c
          hdiutil attach -readonly -nobrowse -mountpoint "$before/mount" "$dmg"
          ditto "$before/mount/MysteryBoard Studio.app" "$before/install/MysteryBoard Studio.app"
          hdiutil detach "$before/mount"
          STUDIO_EXEC="$before/install/MysteryBoard Studio.app/Contents/MacOS/MysteryBoard Studio" node qa/studio/import-024/windows.mjs artifacts/import-024/Fenster-022 0.2.2
          STUDIO_EXEC="$before/install/MysteryBoard Studio.app/Contents/MacOS/MysteryBoard Studio" EDITOR_BASELINE=1 EDITOR_EVIDENCE=artifacts/studio-023-before node qa/studio/editor-023.mjs 2>&1 | tee artifacts/mac-board-tests/Editor-Vorher.log
          echo "EDITOR_LEGACY_DIR=$(dirname "$dmg")" >> "$GITHUB_ENV"
      - name: Editor, three PDFs, and the real exported learner application
        shell: bash
        run: |
          set -euo pipefail
          EDITOR_VERSION=0.2.4 EDITOR_EVIDENCE=artifacts/studio-023 node qa/studio/editor-023.mjs 2>&1 | tee artifacts/mac-board-tests/Editor.log
      - name: Existing macOS application regression
        shell: bash
        run: |
          set -euo pipefail
          npm run studio:test 2>&1 | tee artifacts/mac-board-tests/Mac-Regression.log
      - name: Compare installed 0.2.3 and 0.2.4 window and screenshot sizes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          before="$RUNNER_TEMP/studio-023-reference"
          mkdir -p "$before/mount" "$before/install"
          gh run download 44323785799 --repo "$GITHUB_REPOSITORY" --name Studio-0.2.3-native-03e7d6ddb85313634e32f5194b35fc116628e913 --dir "$before/download"
          dmg="$(find "$before/download" -name '*.dmg' -print -quit)"
          printf '%s  %s\n' 'f9840bc2d0c20fa631520c52736f6614e1d4b87e741be444c8ea6156cc747a36' "$dmg" | shasum -a 256 -c
          hdiutil attach -readonly -nobrowse -mountpoint "$before/mount" "$dmg"
          ditto "$before/mount/MysteryBoard Studio.app" "$before/install/MysteryBoard Studio.app"
          hdiutil detach "$before/mount"
          STUDIO_EXEC="$before/install/MysteryBoard Studio.app/Contents/MacOS/MysteryBoard Studio" node qa/studio/import-024/windows.mjs artifacts/import-024/Fenster-023 0.2.3
          node qa/studio/import-024/windows.mjs artifacts/import-024/Fenster-024 0.2.4
      - name: Independent neutral matrix, two installed author and SCORM workflows
        run: |
          set -euo pipefail
          fixtures="$RUNNER_TEMP/neutral"
          python3 qa/studio/import-024/fixtures.py "$fixtures"
          node qa/studio/import-024/matrix.mjs "$fixtures" artifacts/import-024/Matrix
          node qa/studio/import-024/limits.mjs "$fixtures" artifacts/import-024/Matrix
          cp "$fixtures/Neutrale-Pruefdokumente.zip" artifacts/import-024/Matrix/
          python3 qa/studio/import-024/compare-neutral.py "$fixtures" artifacts/import-024/Matrix
          for label in P04 P05; do
            EDITOR_VERSION=0.2.4 EDITOR_IMPORT_AUDIT=1 EDITOR_EVIDENCE=artifacts/import-024/"$label" EDITOR_NEUTRAL="$fixtures/$label.pdf" node qa/studio/editor-023.mjs
          done
      - name: Original PDF only in the installed application on this runner
        env:
          PRIVATE_PDF_URL: ${{ secrets.STUDIO_QA_PDF_URL }}
        run: |
          set -euo pipefail
          if [[ -z "$PRIVATE_PDF_URL" ]]; then
            echo 'P01 nicht nativ geprüft. Privater Eingang STUDIO_QA_PDF_URL fehlt.' > artifacts/import-024/P01-Status.txt
            exit 0
          fi
          work="$RUNNER_TEMP/Mystery-P01"
          mkdir -p "$work"
          curl --silent --fail --location --proto '=https' --proto-redir '=https' --max-time 90 --max-filesize 2000000 --output "$work/Mystery.pdf" "$PRIVATE_PDF_URL"
          printf '%s  %s\n' '07efd68057712f082819456c099a971f335c035f70b70076cda79c35bf914693' "$work/Mystery.pdf" | shasum -a 256 -c
          EDITOR_VERSION=0.2.4 EDITOR_IMPORT_AUDIT=1 EDITOR_EVIDENCE="$work/results" EDITOR_ORIGINAL="$work/Mystery.pdf" node qa/studio/editor-023.mjs > "$work/workflow.log" 2>&1
          python3 qa/studio/import-024/verify-original.py "$work/Mystery.pdf" "$work/results"
          cp "$work/results/P01-Messwerte.json" artifacts/import-024/
          cp "$work/results/Editor-Nachher.json" artifacts/import-024/P01-Mac-SCORM.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Studio-0.2.4-Importnachweis-${{ github.sha }}
          path: |
            artifacts/import-024/**/Fenster-*.json
            artifacts/import-024/**/*-Fenster-*.png
            artifacts/import-024/Matrix/*.json
            artifacts/import-024/Matrix/P??.png
            artifacts/import-024/Matrix/Neutrale-Pruefdokumente.zip
            artifacts/import-024/P0?/Korrigierte-Bildzuordnung.png
            artifacts/import-024/P0?/Editor-Nachher.json
            artifacts/import-024/P0?/Vollstaendigkeitskontrolle.png
            artifacts/import-024/P0?/SCORM-Bildkarte.png
            artifacts/import-024/P01-*
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Studio-0.2.4-native-${{ github.sha }}
          path: |
            artifacts/mac-board-tests/
            artifacts/studio-tests/native-macos.json
            artifacts/studio-023/*.png
            artifacts/studio-023/Editor-Nachher.json
            artifacts/studio-023/Gestaltete-Aufgabe-SCORM.zip
            artifacts/studio-023/Uebernommene-Bildkarte.*
            artifacts/studio-023-before/*.png
            artifacts/studio-023-before/Editor-Vorher.json
            !artifacts/mac-board-tests/profile/**
            !artifacts/mac-board-tests/sco/**
            !artifacts/mac-board-tests/legacy-sco/**
            !artifacts/mac-board-tests/legacy-021-sco/**
            !artifacts/mac-board-tests/*/task-*/**
            !artifacts/mac-board-tests/*/example/**
          compression-level: 0
          overwrite: true
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OCR_EVIDENCE_DIR: ${{ github.workspace }}/artifacts/board-regression/ocr
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install pinned Chromium 156 for the browser regression
        shell: bash
        run: |
          set -euo pipefail
          browser_dir="$RUNNER_TEMP/mysteryboard-browser"
          mkdir -p "$browser_dir"
          curl -fsSL --retry 3 https://storage.googleapis.com/chrome-for-testing-public/156.0.8078.80/linux64/chrome-linux64.zip -o "$browser_dir/chrome.zip"
          echo "b711c720f774be355197f32edf37e0651418ba036d92446ee2da19ac017540a7  $browser_dir/chrome.zip" | sha256sum -c
          unzip -q "$browser_dir/chrome.zip" -d "$browser_dir"
          "$browser_dir/chrome-linux64/chrome" --version
          echo "CHROMIUM_PATH=$browser_dir/chrome-linux64/chrome" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent PDF and image test tools
        shell: bash
        run: |
          if ! command -v pdftotext >/dev/null || ! command -v pdfinfo >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends poppler-utils
          fi
          python3 -m pip install PyMuPDF==1.26.7 Pillow==12.0.0
      - name: Type check, data tests and frozen classroom build
        if: matrix.shard == 1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/board-regression
          npm test 2>&1 | tee artifacts/board-regression/Daten.log
          npm run build 2>&1 | tee artifacts/board-regression/Build.log
          npm run studio:build 2>&1 | tee artifacts/board-regression/Studio-Build.log
          node qa/studio/board-reproduction.mjs 2>&1 | tee artifacts/board-regression/Vorher-Nachher.log
          npm run test:rc2 2>&1 | tee artifacts/board-regression/RC2.log
      - name: Complete browser suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/board-regression
          # npm run check builds production and preview HTML before test:e2e.
          if [ "${{ matrix.shard }}" != "1" ]; then
            npm run build 2>&1 | tee artifacts/board-regression/HTML-Build-${{ matrix.shard }}.log
          fi
          npm run test:e2e -- --shard=${{ matrix.shard }}/4 2>&1 | tee artifacts/board-regression/Chromium-${{ matrix.shard }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Studio-0.2.4-regression-${{ matrix.shard }}-${{ github.sha }}
          path: artifacts/board-regression/
          overwrite: true
  delivery:
    runs-on: ubuntu-24.04
    needs: [native,regression]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Studio-0.2.4-*
          path: board-acceptance
      - name: Verify all evidence including the private native test before packaging
        run: python3 qa/studio/import-024/package.py board-acceptance board-delivery
      - uses: actions/upload-artifact@v4
        with:
          name: MysteryBoard-Studio-0.2.4-Mac-Apple-Silicon-KOMPLETTPAKET
          path: board-delivery/*-KOMPLETTPAKET.zip
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: MysteryBoard-Studio-0.2.4-Sichtpruefung
          path: board-delivery/*-Sichtpruefung.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: MysteryBoard-Studio-0.2.4-Mac-Apple-Silicon-DMG
          path: board-delivery/*.dmg
          compression-level: 0
          if-no-files-found: error
